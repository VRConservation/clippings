site_name: Clippings
site_url: https://vrconservation.github.io/clippings/
repo_url: https://github.com/VRConservation/clippings
repo_name: VRConservation/clippings
edit_uri: edit/main/notes/

docs_dir: notes

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
    - toc.follow

extra_css:
  - stylesheets/extra.css

hooks:
  - hooks.py

plugins:
  - search
  - roamlinks

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home:
    - index.md
    - Fire: Fire.md
    - Forecasting: Forecasting.md
    - Software: Software.md
    - Geospatial: Geospatial.md
    - Remote Sensing: Remote_Sensing.md
    - Insurance: Insurance.md
    - Exercise: Exercise.md
    - Misc: Misc.md
    - Changelog: log.md
    - Catalog: Catalog.md
